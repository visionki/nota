# Bootstrap HTTP-01 validation before the first certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name nota.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "Nota is being deployed.\n";
    }
}
